# Production deployment compose for Stydu4
# Topology: nginx reverse-proxy on :80/:443 -> { /api/v1/* -> app ; /* -> frontend }
#           certbot obtains and renews Let's Encrypt certs (webroot challenge)
#           mysql/redis/app/frontend are internal-only (no host port exposure)
#
# Layout on host (clone both repos as siblings):
#   ~/deploy/stydu4/                  (this repo, run docker compose here)
#   ~/deploy/stydu4-frontend/         (frontend repo)
#
# First-time setup:
#   1. cp .env.example .env  &&  edit values
#   2. ./init-letsencrypt.sh           (bootstrap SSL cert)
#   3. docker compose up -d

services:
  mysql:
    image: mysql:8.0
    container_name: stydu4-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-db_stydu4}
      MYSQL_USER: ${MYSQL_USER:-stydu4_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - stydu4-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      # Tuned for 1GB-RAM VPS (defaults assume ~8GB+).
      - --innodb-buffer-pool-size=128M
      - --innodb-log-file-size=32M
      - --max-connections=50
      - --performance-schema=OFF

  redis:
    image: redis:7-alpine
    container_name: stydu4-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - stydu4-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    command: redis-server --appendonly yes

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stydu4-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-db_stydu4}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-stydu4_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_FRONTEND_URL: https://${APP_DOMAIN}
      APP_FRONTEND_BASE_URL: https://${APP_DOMAIN}
      FILE_STORAGE_LOCATION: /app/storage
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy}
      MAIL_USERNAME: ${MAIL_USERNAME:-noreply@example.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@example.com}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-dummy}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-dummy}
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:+UseG1GC -XX:MaxRAMPercentage=50"
    volumes:
      - app_storage:/app/storage
      - app_logs:/app/logs
    networks:
      - stydu4-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: ../stydu4-frontend
      dockerfile: Dockerfile
    container_name: stydu4-frontend
    restart: unless-stopped
    networks:
      - stydu4-network
    depends_on:
      - app

  nginx:
    image: nginx:1.27-alpine
    container_name: stydu4-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    command: >
      /bin/sh -c "envsubst '$$APP_DOMAIN' < /etc/nginx/templates/default.conf.template
      > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
    networks:
      - stydu4-network
    depends_on:
      - frontend
      - app

  certbot:
    image: certbot/certbot:latest
    container_name: stydu4-certbot
    restart: unless-stopped
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'

volumes:
  mysql_data:
  redis_data:
  app_storage:
  app_logs:
  certbot_etc:
  certbot_www:

networks:
  stydu4-network:
    driver: bridge
