# docker-compose.simple.yml
# Mục tiêu: đơn giản, dễ chạy cho dev (MySQL + Redis + Backend)
# Chạy: docker compose -f docker-compose.simple.yml up -d

version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: stydu4-mysql-simple
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: db_stydu4
      MYSQL_USER: stydu4_user
      MYSQL_PASSWORD: stydu4_pass
    ports:
      - "3307:3306"  # dùng 3307 bên ngoài để tránh đụng MySQL local
    volumes:
      - mysql_data_simple:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: stydu4-redis-simple
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    # Dùng Dockerfile của dự án backend (ở thư mục hiện tại)
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stydu4-backend-simple
    depends_on:
      - mysql
      - redis
    environment:
      # Kích hoạt profile dev
      SPRING_PROFILES_ACTIVE: dev

      # Cấu hình MySQL (trỏ tới service "mysql" ở trên)
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_stydu4?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: stydu4_user
      SPRING_DATASOURCE_PASSWORD: stydu4_pass

      # Cấu hình Redis (trỏ tới service "redis")
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      # URL frontend để redirect OAuth2 (dev dùng Vite port 5173)
      APP_FRONTEND_URL: http://localhost:5173

      # JWT key dev (đặt tạm cho môi trường local)
      JWT_SIGNER_KEY: dev-secret-key-at-least-32-chars-1234567890abcd

      # Tuỳ chọn: Stripe/Email có thể bổ sung sau khi cần
      # STRIPE_API_KEY: sk_test_xxx
      # MAIL_USERNAME: ""
      # MAIL_PASSWORD: ""

    ports:
      - "8080:8080"  # API backend
    restart: unless-stopped

volumes:
  mysql_data_simple:
    driver: local
