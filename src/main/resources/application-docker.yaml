# Docker profile for production/container deployment
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/db_stydu4?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:stydu4_user}
    password: ${SPRING_DATASOURCE_PASSWORD:stydu4_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Production pool configuration (larger for container)
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # Connection leak detection
      leak-detection-threshold: 60000
      pool-name: Stydu4HikariCP-Docker
      connection-test-query: SELECT 1
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 16
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: 0

server:
  port: 8080

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:3000}
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:8080}

file:
  storage:
    location: ${FILE_STORAGE_LOCATION:/app/storage}

logging:
  file:
    name: /app/logs/stydu4.log
    path: /app/logs
  level:
    root: INFO
    com.lul.Stydu4: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# Actuator for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
