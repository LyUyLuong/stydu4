# Đặt profile mặc định là 'dev'
spring:
  profiles:
    active: dev
  application:
    name: Stydu4
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 617072968798-jdhme3ske636f4qtdjs6ac6c23329b3p.apps.googleusercontent.com
            client-secret: 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
            scope:
              - email
              - profile
            redirect-uri: "http://localhost:${server.port}/api/v1/login/oauth2/code/google"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 200MB
      file-size-threshold: 2MB

server:
  servlet:
    context-path: /api/v1

app:
  frontend:
    url: http://localhost:5173
    base-url: http://localhost:${server.port}

application:
  swagger:
    dev-url: http://localhost:${server.port}
    prod-url: https://api.stydu4.com

jwt:
  signerKey: "cxwHya1whYAEv/LiFOjn928sU0kL/F953Ba2TLePb+tCM5usAtSnIMGXE2QYNIpb"
