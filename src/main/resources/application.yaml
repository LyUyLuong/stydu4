# Đặt profile mặc định là 'dev'
spring:
  profiles:
    active: dev
  application:
    name: Stydu4
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "http://localhost:${server.port}/api/v1/login/oauth2/code/google"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 200MB
      file-size-threshold: 2MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:yeppymine@gmail.com}
    password: ${MAIL_PASSWORD:}  # ← MUST use environment variable!
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  servlet:
    context-path: /api/v1

app:
  frontend:
    url: http://localhost:5173
    base-url: http://localhost:${server.port}

application:
  swagger:
    dev-url: http://localhost:${server.port}
    prod-url: https://api.stydu4.com

jwt:
  signerKey: ${JWT_SIGNER_KEY}
  valid-duration: 36000 # in seconds
  refreshable-duration: 36000 # in seconds

# Stripe Configuration
stripe:
  api-key: ${STRIPE_API_KEY}
  success-url: ${app.frontend.url}/payment/success?session_id={CHECKOUT_SESSION_ID}
  cancel-url: ${app.frontend.url}/payment/cancel
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}

# Email Configuration
email:
  from: ${EMAIL_FROM:noreply@stydu4.com}
  enabled: ${EMAIL_ENABLED:true}

# Logging Configuration
logging:
  file:
    name: logs/stydu4.log
    path: logs
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} ${LOG_LEVEL_PATTERN:-%5p} [%t] %-40.40logger{39} : %m%n"
  level:
    root: INFO
    com.lul.Stydu4: DEBUG
    com.lul.Stydu4.controller: DEBUG
    com.lul.Stydu4.service: DEBUG
    com.lul.Stydu4.repository: DEBUG
    com.lul.Stydu4.security: INFO
    com.lul.Stydu4.exception: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.boot: INFO
    org.springframework.data: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.type: INFO
    org.springframework.data.redis: INFO
    org.springframework.security.oauth2: DEBUG

file:
  storage:
    location: D:/toeic-storage
  upload:
    images:
      allowed-extensions: jpg,jpeg,png,gif,webp,svg
      max-size: 5MB
    audio:
      allowed-extensions: mp3,wav,m4a,ogg,aac
      max-size: 100MB