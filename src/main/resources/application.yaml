server:
  port: 8080

app:
  frontend:
    url: http://localhost:5500  # URL của frontend
    base-url: http://localhost:8080

application:
  swagger:
    dev-url: http://localhost:8080
    prod-url: https://api.stydu4.com

spring:
  application:
    name: Stydu4
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:stydu5}?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:luong123}
  jpa:
    database: mysql
    hibernate:
      #ddl-auto: none
      #ddl-auto: create
      ddl-auto: update
      #ddl-auto: create-drop
    properties:
      format_sql: true
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 200MB
      file-size-threshold: 2MB

jwt:
  signerKey: ${JWT_SIGNER_KEY}
  valid-duration: ${JWT_VALID_DURATION:36000} # in seconds
  refreshable-duration: ${JWT_REFRESHABLE_DURATION:36000} # in seconds

# Stripe Configuration
stripe:
  api-key: ${STRIPE_API_KEY}
  success-url: ${app.frontend.url}/payment/success?session_id={CHECKOUT_SESSION_ID}
  cancel-url: ${app.frontend.url}/payment/cancel

# Logging Configuration
logging:
  file:
    name: logs/stydu4.log
    path: logs
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} ${LOG_LEVEL_PATTERN:-%5p} [%t] %-40.40logger{39} : %m%n"
  level:
    # Root level
    root: INFO
    
    # Application packages
    com.lul.Stydu4: DEBUG
    com.lul.Stydu4.controller: DEBUG
    com.lul.Stydu4.service: DEBUG
    com.lul.Stydu4.repository: DEBUG
    com.lul.Stydu4.security: INFO
    com.lul.Stydu4.exception: DEBUG
    
    # Spring Framework
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.boot: INFO
    org.springframework.data: INFO
    
    # Hibernate/JPA
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.type: INFO
    
    # Redis
    org.springframework.data.redis: INFO
    
    # OAuth2
    org.springframework.security.oauth2: DEBUG

file:
  storage:
    location: D:/toeic-storage  # Change to your path
  upload:
    images:
      allowed-extensions: jpg,jpeg,png,gif,webp,svg
      max-size: 5MB
    audio:
      allowed-extensions: mp3,wav,m4a,ogg,aac
      max-size: 100MB